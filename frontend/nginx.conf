server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://backend:8000;
  }

  # Las rutas de React Router caen en index.html
  location / {
    try_files $uri /index.html;
  }

  # Sin caché para que después de un despliegue se pidan los assets nuevos
  location = /index.html {
    add_header Cache-Control no-cache;
  }
}
