server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    # El cuerpo incluye el PDF (hasta 10 MiB) y el formulario multipart.
    client_max_body_size 11m;
    error_page 413 =422 @archivo_demasiado_grande;
    proxy_pass http://backend:8000;
  }

  location @archivo_demasiado_grande {
    default_type application/json;
    return 422 '{"detail":"El PDF no puede superar los 10 MB"}';
  }

  # Las rutas de React Router caen en index.html
  location / {
    try_files $uri /index.html;
  }

  # Sin caché para que después de un despliegue se pidan los assets nuevos
  location = /index.html {
    add_header Cache-Control no-cache;
  }
}
