services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: logistica_policial
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:${MYSQL_PUERTO:-3306}:3306"
    volumes:
      - mysql_datos:/var/lib/mysql
      - ./database/migraciones:/docker-entrypoint-initdb.d:ro

volumes:
  mysql_datos:
